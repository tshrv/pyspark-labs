services:
  spark-master:
    # image: apache/spark:4.0.1
    build: 
      context: .
      dockerfile: spark.Dockerfile
    image: apache-spark:4.0.1

    container_name: spark-master
    hostname: spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - ./data:/data

  spark-worker-1:
    image: apache-spark:4.0.1

    container_name: spark-worker-1

    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    ports:
      - "8081:8081"

    volumes:
      - ./data:/data

  spark-worker-2:
    image: apache-spark:4.0.1

    container_name: spark-worker-2

    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    ports:
      - "8082:8081"

    volumes:
      - ./data:/data
  
  minio:
    image: minio/minio
    container_name: pyspark-labs-minio
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - ./data:/data
  
  minio-init:
    image: minio/mc
    container_name: pyspark-labs-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://pyspark-labs-minio:9000 admin password123; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/pyspark-labs;
      echo 'Bucket pyspark-labs is ready.';
      "
    restart: "no"
  
  app:
    image: apache-spark:4.0.1
    container_name: pyspark-labs-app
    hostname: pyspark-labs-app
    depends_on:
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app
    working_dir: /app
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.driver.host=pyspark-labs-app
      main.py
    restart: "no"
  
  stream_processor_app:
    image: apache-spark:4.0.1
    container_name: pyspark-labs-stream-processor-app
    hostname: pyspark-labs-stream-processor-app
    depends_on:
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app
    working_dir: /app
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.driver.host=pyspark-labs-stream-processor-app
      stream_processor.py
    restart: "no"